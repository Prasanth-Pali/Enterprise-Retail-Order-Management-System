name: CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Build .NET API
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore "Enterprise Retail & Order Management System.slnx"

      - name: Build
        run: dotnet build "Enterprise Retail & Order Management System.slnx" --configuration Release --no-restore

  frontend:
    name: Build and test Angular app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise-retail-order-management-ui

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: enterprise-retail-order-management-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test -- --watch=false
