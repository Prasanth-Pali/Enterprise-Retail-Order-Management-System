services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__RetailFlowConnection: ${RETAILFLOW_CONNECTION_STRING:?Set RETAILFLOW_CONNECTION_STRING in .env}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Cors__AllowedOrigins__0: http://localhost:8080
    ports:
      - "5150:8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    depends_on:
      - api
    environment:
      API_UPSTREAM: http://api:8080
      PORT: 80
    ports:
      - "8080:80"
