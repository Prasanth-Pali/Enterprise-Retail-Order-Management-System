services:
  api:
    build:
      context: .
      dockerfile: "Enterprise Retail & Order Management System/Dockerfile"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__RetailFlowConnection: ${RETAILFLOW_CONNECTION_STRING:?Set RETAILFLOW_CONNECTION_STRING in .env}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Cors__AllowedOrigins__0: http://localhost:8080
    ports:
      - "5150:8080"

  frontend:
    build:
      context: ./enterprise-retail-order-management-ui
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"
